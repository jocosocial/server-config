---
- name: install chrony
  package:
    name: chrony
    state: present
  become: yes

- name: enable chrony
  service:
    name: chrony
    state: started
    enabled: true
  become: yes

- name: chrony sources
  template:
    src: twitarr.sources.j2
    dest: /etc/chrony/sources.d/twitarr.sources
  become: yes
  notify: reload chrony sources

- name: chrony config
  template:
    src: twitarr.conf.j2
    dest: /etc/chrony/conf.d/twitarr.conf
  become: yes
  notify: restart chrony

---
- name: Install misc tools
  package:
    name:
      - ncdu          # TUI filesystem space viewer.
      - net-tools     # ifconfig, etc.
      - apache2-utils # htpasswd, htdigest, and other password generating tools.
      - jq            # JSON parser
      - git           # Version control
      - openssl
      - htop
      - iftop
      - nmap
      - telnet
      - iperf3
      - jhead
      - glances
      - iotop
      - tcpdump
      - bind9-dnsutils
      - lldb
      - acl
      - vim
      - apt-file       # Apt search
      - unzip          # Archive extractor
      - tmux           # Terminal multiplexer
      - apparmor-utils # AppArmor utilities
      - certbot        # Let's Encrypt client
      - python3-certbot-dns-cloudflare # Certbot DNS-01 plugin for Cloudflare
    state: present
  become: yes

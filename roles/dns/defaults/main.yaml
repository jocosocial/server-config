---
hosts_entries:
  - address: 127.0.0.1
    names:
      - localhost
      - localhost.localdomain
      - localhost4
      - localhost4.localdomain4
      - "{{ ansible_facts['hostname'] }}"
      - "{{ ansible_facts['hostname'] }}.localdomain"
  - address: "::1"
    names:
      - localhost
      - localhost.localdomain
      - localhost4
      - localhost4.localdomain4
      - "{{ ansible_facts['hostname'] }}"
      - "{{ ansible_facts['hostname'] }}.localdomain"
  - address: "172.17.0.1"
    names:
      - host.docker.internal
  - address: "{{ twitarr_private_ip }}"
    names:
      - joco.hollandamerica.com

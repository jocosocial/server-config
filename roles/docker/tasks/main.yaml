---
- name: purge snap
  snap:
    name: docker
    state: absent
  become: yes

- name: install repo dependencies
  package:
    name:
      - ca-certificates
      # required by deb822_repository
      - python3-debian
    state: present
  become: yes

# apt-key is gone as of Ubuntu 26.04; deb822_repository fetches the key into
# /etc/apt/keyrings and references it via Signed-By
- name: repository
  deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present
  register: docker_repo
  become: yes

- name: install docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: "{{ docker_repo is changed }}"
  become: yes

- name: create config directory
  file:
    path: /etc/docker
    state: directory
    mode: 0755
  become: yes

- name: configure daemon
  copy:
    content: "{{ docker_daemon_config | to_nice_json }}"
    dest: /etc/docker/daemon.json
    backup: yes
  become: yes
  notify:
    - restart docker

- import_role:
    name: logrotate
    tasks_from: docker

- name: enable service
  service:
    name: docker
    state: started
    enabled: yes
  become: yes

- name: configure legacy plugin access
  file:
    src: /usr/libexec/docker/cli-plugins/docker-compose
    dest: /usr/local/bin/docker-compose
    state: link
  become: yes

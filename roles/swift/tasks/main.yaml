---
# swiftly refuses to run without gpg (signature verification) and warns
# without CA certs; toolchain deps come from its post-install script below
- name: install swiftly dependencies
  package:
    name:
      - ca-certificates
      - gpg
    state: present
  become: yes

- name: check for existing swiftly install
  stat:
    path: "{{ swiftly_bin_dir }}/swiftly"
  register: swiftly_bin

- name: bootstrap swiftly
  when: not swiftly_bin.stat.exists
  become: yes
  block:
    - name: create swiftly staging directory
      tempfile:
        state: directory
        prefix: swiftly
      register: swiftly_staging

    - name: download swiftly
      get_url:
        url: https://download.swift.org/swiftly/linux/swiftly-{{ ansible_facts["architecture"] }}.tar.gz
        dest: "{{ swiftly_staging.path }}/swiftly.tar.gz"
        mode: 0644

    - name: extract swiftly
      unarchive:
        src: "{{ swiftly_staging.path }}/swiftly.tar.gz"
        dest: "{{ swiftly_staging.path }}"
        remote_src: yes

    - name: initialize swiftly
      command: >-
        {{ swiftly_staging.path }}/swiftly init
        --assume-yes
        --no-modify-profile
        --quiet-shell-followup
        --skip-install
      environment: "{{ swiftly_env }}"

  always:
    - name: remove swiftly staging directory
      file:
        path: "{{ swiftly_staging.path }}"
        state: absent
      when: swiftly_staging.path is defined

- name: install swift {{ swift_version }}
  command: >-
    {{ swiftly_bin_dir }}/swiftly install {{ swift_version }}
    --assume-yes
    --post-install-file {{ swiftly_home_dir }}/post-install.sh
  args:
    creates: "{{ swiftly_toolchains_dir }}/{{ swift_version }}"
  environment: "{{ swiftly_env }}"
  become: yes

# swiftly skips the install if its config already lists the version, even
# when the toolchain files are somewhere else
- name: check swift {{ swift_version }} toolchain is present
  stat:
    path: "{{ swiftly_toolchains_dir }}/{{ swift_version }}/usr/bin/swift"
  register: swift_toolchain_bin
  become: yes

- name: verify swift {{ swift_version }} toolchain location
  assert:
    that: swift_toolchain_bin.stat.exists
    fail_msg: >-
      swiftly reports {{ swift_version }} as installed but it is not in
      {{ swiftly_toolchains_dir }}. Remove {{ swiftly_home_dir }} (and any
      ~/.local/share/swiftly) and rerun.
    quiet: true

# swiftly writes out the system packages the toolchain needs (e.g. libxml2-16
# vs libxml2) rather than installing them itself, and only if any are missing
- name: install swift system dependencies
  shell: |
    if [ -f post-install.sh ]; then
      bash post-install.sh
      rm -f post-install.sh
      echo installed
    fi
  args:
    chdir: "{{ swiftly_home_dir }}"
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: swift_post_install
  changed_when: "'installed' in swift_post_install.stdout"
  become: yes

- name: get current swift toolchain
  command: "{{ swiftly_bin_dir }}/swiftly use"
  environment: "{{ swiftly_env }}"
  register: swiftly_current
  changed_when: false
  become: yes

- name: set swift {{ swift_version }} as default toolchain
  command: "{{ swiftly_bin_dir }}/swiftly use --global-default --assume-yes {{ swift_version }}"
  environment: "{{ swiftly_env }}"
  when: swift_version not in swiftly_current.stdout
  become: yes

- name: Configure swiftly environment in profile.d
  template:
    src: swift.sh.j2
    dest: /etc/profile.d/swift.sh
    mode: 0644
  become: yes

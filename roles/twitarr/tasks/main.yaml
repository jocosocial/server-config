---
- name: create directories
  file:
    path: "{{ item }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    state: directory
  become: yes
  with_items:
    - "{{ twitarr_root_dir }}"

# Backups must not be world readable. The backup tools create files with a
# permissive umask, so access is restricted at the directory level instead.
- name: create backup directories
  file:
    path: "{{ item }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: 0700
    state: directory
  become: yes
  with_items:
    - "{{ twitarr_backups_dir }}/images"
    - "{{ twitarr_backups_dir }}/buildcache"
    - "{{ twitarr_backups_dir }}/redis"
    - "{{ twitarr_backups_dir }}/prometheus"

- name: create backups directory
  file:
    path: "{{ twitarr_backups_dir }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: 0750
    state: directory
  become: yes

# The pgbackups container runs as its image's postgres user, not root. The
# group stays the admin user's so it can read the dumps.
- name: create database backups directory
  file:
    path: "{{ twitarr_backups_dir }}/database"
    owner: "{{ twitarr_pgbackups_uid }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: 0750
    state: directory
  become: yes

- name: create log directory
  file:
    path: "{{ twitarr_logs_dir }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: adm
    state: directory
    mode: 0775
  become: yes
  notify: restart rsyslog

- import_role:
    name: logrotate
    tasks_from: twitarr

- name: link coredump directory
  file:
    src: /var/lib/systemd/coredump/
    dest: "{{ twitarr_coredump_dir }}"
    state: link

# Ensure these are up to date with swiftarr's Dockerfile and init-prereqs.sh
- name: install development dependencies
  package:
    name:
      - libvips-dev
      # libheif's HEIC and AVIF decoders are separate packages as of 26.04
      - libheif-plugin-libde265
      - libheif-plugin-dav1d
    state: present
  become: yes

- name: clone microkaraoke
  git:
    repo: "https://github.com/jocosocial/microkaraoke_songs"
    dest: "{{ twitarr_microkaraoke_dir }}"
    version: main

- name: clone source
  git:
    repo: "https://github.com/jocosocial/swiftarr"
    dest: "{{ twitarr_src_dir }}"
    version: master

- name: clone deploy
  git:
    repo: "github.com:jocosocial/twitarr-prod"
    dest: "{{ twitarr_deploy_dir }}"
    key_file: "/home/{{ ansible_facts['user_id'] }}/.ssh/deploy"

- name: configure source repo
  ini_file:
    path: "{{ twitarr_src_dir }}/.git/config"
    section: receive
    option: denyCurrentBranch
    value: updateInstead

- name: configure deploy repo
  ini_file:
    path: "{{ twitarr_deploy_dir }}/.git/config"
    section: receive
    option: denyCurrentBranch
    value: updateInstead

- name: configure microkaraoke repo
  ini_file:
    path: "{{ twitarr_microkaraoke_dir }}/.git/config"
    section: receive
    option: denyCurrentBranch
    value: updateInstead

- name: link production config for builds
  file:
    src: "{{ twitarr_deploy_dir }}/production.env"
    dest: "{{ twitarr_src_dir }}/Sources/swiftarr/seeds/Private Swiftarr Config/production.env"
    state: link

- name: setup python environment for swiftarr
  import_tasks: python.yaml

- name: create volumes
  docker_volume:
    name: "{{ item }}"
    state: present
  with_items:
    - images
    - pgdata
    - redisdata
    - prometheus
    - alertmanager
    - grafana
    - senddata
    - dockhand

# Ensure these are up to date with swiftarr's Dockerfile
- name: pull build images
  docker_image:
    source: pull
    repository: "{{ item.repo }}"
    name: "{{ item.name }}"
    tag: "{{ item.tag }}"
  with_items:
    - repo: docker.io/library
      name: swift
      tag: 6.4-resolute
    - repo: docker.io/library
      name: ubuntu
      tag: 26.04
